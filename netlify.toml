[build]
  base = "/"
  command = "pnpm install && pnpm build && pnpm build-storybook"
  publish = "apps/storybook-web/storybook-static"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Build plugins
[[plugins]]
  package = "@netlify/plugin-lighthouse"
